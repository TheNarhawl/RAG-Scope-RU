name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality (flake8 & matrix validation)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linter & pyyaml
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyyaml

      - name: Run flake8 check
        run: |
          flake8 --count --show-source --statistics

      - name: Verify config generation
        run: |
          python make_configs.py

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run pytest test suite
        run: |
          pytest -v

  docker:
    name: Docker Build & Verification
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: rag-scope-ru:ci
          load: true

      - name: Run container sanity check
        run: |
          docker run --rm rag-scope-ru:ci python src/pipelines/ingest.py --help
          docker run --rm rag-scope-ru:ci python src/pipelines/evaluate.py --help

