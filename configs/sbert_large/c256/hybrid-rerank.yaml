meta:
  name: sbert_large-c256-hybrid-rerank
  device: auto
ingest:
  embedding_model: ai-forever/sbert_large_nlu_ru
  collection: sbert_large_c256
  chunk_size: 256
  chunk_overlap: 32
  chunk_strategy: structural
retrieve:
  top_k: 10
  vector_name: dense
  use_hybrid: true
  use_rerank: true
  rerank_candidates: 20
  reranker_model: BAAI/bge-reranker-v2-m3
