meta:
  name: e5_small-c256-hybrid-rerank
  device: auto
ingest:
  embedding_model: intfloat/multilingual-e5-small
  collection: e5_small_c256
  chunk_size: 256
  chunk_overlap: 32
  chunk_strategy: structural
  passage_prefix: 'passage: '
  query_prefix: 'query: '
retrieve:
  top_k: 10
  vector_name: dense
  use_hybrid: true
  use_rerank: true
  rerank_candidates: 20
  reranker_model: BAAI/bge-reranker-v2-m3
