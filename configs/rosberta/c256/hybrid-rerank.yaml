meta:
  name: rosberta-c256-hybrid-rerank
  device: auto
ingest:
  embedding_model: ai-forever/ru-en-RoSBERTa
  collection: rosberta_c256
  chunk_size: 256
  chunk_overlap: 32
  passage_prefix: 'search_document: '
  query_prefix: 'search_query: '
retrieve:
  top_k: 10
  vector_name: dense
  use_hybrid: true
  use_rerank: true
  rerank_candidates: 20
  reranker_model: BAAI/bge-reranker-v2-m3
