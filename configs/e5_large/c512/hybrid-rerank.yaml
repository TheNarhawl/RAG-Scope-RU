meta:
  name: e5_large-c512-hybrid-rerank
  device: auto
ingest:
  embedding_model: intfloat/multilingual-e5-large
  collection: e5_large_c512
  chunk_size: 512
  chunk_overlap: 64
  chunk_strategy: structural
  passage_prefix: 'passage: '
  query_prefix: 'query: '
retrieve:
  top_k: 10
  vector_name: dense
  use_hybrid: true
  use_rerank: true
  rerank_candidates: 20
  reranker_model: BAAI/bge-reranker-v2-m3
