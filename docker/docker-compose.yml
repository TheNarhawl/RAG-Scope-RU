services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: rag-scope-ru:latest
    env_file:
      - ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATA_DIR: /data
      EXPERIMENTS_DIR: /experiments
    volumes:
      - ../data:/data
      - ../experiments:/experiments
      - ../src:/app/src
      - ../configs:/app/configs
      - hf_cache:/cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - qdrant
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
  hf_cache: